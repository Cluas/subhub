services:
  subhub:
    build: .
    ports:
      - "9000:9000"
    environment:
      - PORT=9000
      - DB_PATH=/data/subhub.db
      - CACHE_TTL_SECONDS=300
      - LOG_LEVEL=info
      - TZ=Asia/Shanghai
    volumes:
      - ./data:/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "--no-verbose", "--tries=1", "--spider", "http://localhost:9000/healthz"]
      interval: 30s
      timeout: 3s
      start_period: 5s
      retries: 3
    deploy:
      resources:
        limits:
          cpus: "0.5"
          memory: 512M
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
